name: nex_radar
description: "NexRadar - Background-first floating radar & speedometer HUD (Azerbaijan & Global Edition)."
publish_to: 'none'

version: 1.3.0+4

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --- Location & motion engine -------------------------------------------
  geolocator: ^14.1.1

  # --- Offline-first storage ----------------------------------------------
  sqflite: ^2.4.4
  path: ^1.9.1
  shared_preferences: ^2.5.5

  # --- Permissions ---------------------------------------------------------
  permission_handler: ^13.0.2

  # --- Voice (Azerbaijani / Turkish TTS) & beeps ---------------------------
  flutter_tts: ^4.2.5
  audioplayers: ^6.8.1

  # --- Crowdsourced radar transport (Firebase) -----------------------------
  http: ^1.6.0
  firebase_core: ^4.15.0
  firebase_database: ^12.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/

  # Inter is bundled instead of pulled from the network: NexRadar is an
  # offline-first driving app, so the UI must render identically in a tunnel.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    - family: InterDisplay
      fonts:
        - asset: assets/fonts/InterDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InterDisplay-Bold.ttf
          weight: 700
